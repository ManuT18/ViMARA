<!-- Zappar WebGL template for Unity 2020 and above versions -->
<!-- NFYNT -->
<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="favicon.ico">
    <title>ViMARA</title>
    <style>
        html {
            box-sizing: border-box;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        html,
        body {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        canvas {
            display: block;
        }

        body {
            margin: 0;
        }

        #unity-container {
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;

            background: #231F20;
        }

        #loading-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #unity-loading-bar {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #unity-progress-bar-empty {
            width: 80%;
            height: 24px;
            margin: 10px 20px 20px 10px;
            text-align: left;
            border: 1px solid white;
            padding: 2px;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: white;
        }

        .light #unity-progress-bar-empty {
            border-color: black;
        }

        .light #unity-progress-bar-full {
            background: black;
        }

        .spinner,
        .spinner:after {
            border-radius: 50%;
            width: 5em;
            height: 5em;
        }

        .spinner {
            margin: 10px;
            font-size: 10px;
            position: relative;
            text-indent: -9999em;
            border-top: 1.1em solid rgba(255, 255, 255, 0.2);
            border-right: 1.1em solid rgba(255, 255, 255, 0.2);
            border-bottom: 1.1em solid rgba(255, 255, 255, 0.2);
            border-left: 1.1em solid #ffffff;
            transform: translateZ(0);
            animation: spinner-spin 1.1s infinite linear;
        }

        @keyframes spinner-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="dark">
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>
    <script type="text/javascript" src="https://libs.zappar.com/zappar-cv/2.1.9/zappar-cv.js"></script>
    <script>
        var db = indexedDB.open("dummy_indexdb", 1); // iOS 14.6 fix; the call to open indexdb hangs forever otherwise

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/unity_ar.loader.js";
        const config = {
            dataUrl: buildUrl + "/unity_ar.data",
            frameworkUrl: buildUrl + "/unity_ar.framework.js",
            codeUrl: buildUrl + "/unity_ar.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "ViMARA",
            productVersion: "1.0.0",
        //Useful when used along with Filename as Hashes option
            cacheControl: function (url) {
            // typically includes: .data, .bundle, .zpt
            if (url.match(/\.data/) || url.match(/\.bundle/) || url.match(/\.zpt/)) {
             return "must-revalidate";
            }
   
            if (url.match(/\.mp4/) || url.match(/\.custom/) || url.match(/\.zbin/)) {
                return "immutable";
            }   
            // Disable explicit caching for all other files.
            // Note: the default browser cache may cache them anyway.
            return "no-store";
            },
        };

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector('.spinner');

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            // Limitar devicePixelRatio en móviles evita saturar la VRAM y el ancho de banda WebGL
            // (en pantallas 3x Retina reduce 80% la carga de sombreado sin pérdida visual perceptible).
            config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.25);
        }
        loadingCover.style.display = "";

        // 1. Interceptar elementos <video> creados en memoria por zappar-cv.js ANTES de inicializar ZCV.
        // zappar-cv.js crea el <video> mediante document.createElement("video") sin insertarlo en el DOM,
        // lo que provoca que móviles (iOS Safari / Android Chrome) congelen la decodificación de frames
        // tras unos segundos y que document.getElementsByTagName("video") devuelva una lista vacía.
        var trackedCameraVideos = [];
        (function interceptOffDomCameraVideos() {
            var origCreateElement = document.createElement.bind(document);
            function prepareCameraVideo(v) {
                if (!v || trackedCameraVideos.indexOf(v) !== -1) return;
                trackedCameraVideos.push(v);
                v.playsInline = true;
                v.muted = true;
                v.autoplay = true;
                v.setAttribute("playsinline", "");
                v.setAttribute("webkit-playsinline", "");
                v.setAttribute("muted", "");
                v.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.001;pointer-events:none;z-index:-1;";
                function autoResume() {
                    if (document.visibilityState === "hidden") return;
                    if (v.paused && v.srcObject) {
                        v.play().catch(function () {});
                    }
                }
                v.addEventListener("pause", autoResume);
                v.addEventListener("suspend", autoResume);
                v.addEventListener("stalled", autoResume);
                v.addEventListener("waiting", autoResume);
                if (!v.isConnected && document.body) {
                    document.body.appendChild(v);
                }
            }
            document.createElement = function (tagName, options) {
                var el = origCreateElement(tagName, options);
                if (typeof tagName === "string" && tagName.toLowerCase() === "video") {
                    prepareCameraVideo(el);
                }
                return el;
            };
        })();

        window.zappar = ZCV.initialize();

        // 2. Proteger las llamadas WebGL del pipeline de Zappar frente a excepciones transitorias
        // para que un error puntual de textura de cámara nunca aborte el bucle requestAnimationFrame de Unity.
        (function wrapZapparPipelineSafety(z) {
            if (!z) return;
            ["pipeline_process_gl", "pipeline_camera_frame_upload_gl", "pipeline_frame_update"].forEach(function (fnName) {
                if (typeof z[fnName] === "function") {
                    var origFn = z[fnName].bind(z);
                    z[fnName] = function (pipeline) {
                        try {
                            return origFn(pipeline);
                        } catch (err) {
                            console.warn("[ViMARA AR] Error transitorio recuperado en " + fnName + ":", err);
                        }
                    };
                }
            });
        })(window.zappar);

        // 3. Watchdog periódico y por eventos sobre todos los videos de cámara (en DOM y en memoria)
        (function installCameraVideoWatchdog() {
            function ensureCameraVideosPlaying() {
                if (document.visibilityState && document.visibilityState !== "visible") return;
                var domVideos = document.getElementsByTagName("video");
                for (var d = 0; d < domVideos.length; d++) {
                    if (trackedCameraVideos.indexOf(domVideos[d]) === -1) {
                        trackedCameraVideos.push(domVideos[d]);
                    }
                }
                for (var i = 0; i < trackedCameraVideos.length; i++) {
                    var v = trackedCameraVideos[i];
                    if (!v) continue;
                    v.playsInline = true;
                    v.muted = true;
                    if (!v.hasAttribute("playsinline")) v.setAttribute("playsinline", "");
                    if (!v.isConnected && document.body) {
                        v.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.001;pointer-events:none;z-index:-1;";
                        document.body.appendChild(v);
                    }
                    if (v.srcObject) {
                        var tracks = v.srcObject.getVideoTracks ? v.srcObject.getVideoTracks() : [];
                        for (var t = 0; t < tracks.length; t++) {
                            if (!tracks[t].enabled) tracks[t].enabled = true;
                        }
                        if (v.paused) {
                            v.play().catch(function () {});
                        }
                    }
                }
            }

            setInterval(ensureCameraVideosPlaying, 1000);
            document.addEventListener("visibilitychange", ensureCameraVideosPlaying);
            window.addEventListener("focus", ensureCameraVideosPlaying);
            window.addEventListener("pageshow", ensureCameraVideosPlaying);
            window.addEventListener("touchstart", ensureCameraVideosPlaying, { passive: true });
            window.addEventListener("touchend", ensureCameraVideosPlaying, { passive: true });
        })();

        canvas.addEventListener("webglcontextlost", function (e) {
            e.preventDefault();
            console.warn("[ViMARA AR] Contexto WebGL perdido; esperando restauración del navegador.");
        }, false);

        const script = document.createElement("script");
        script.src = loaderUrl;
        //script.onload = () => { CreateUnityLoader();   };
        document.body.appendChild(script);

        window.zappar.permission_request_ui_promise().then(WaitForZCVLoad);

        function WaitForZCVLoad() {
            if (zappar.loaded()) {
                CreateUnityLoader();
                return;
            }
            setTimeout(WaitForZCVLoad, 500);
        }

        var pendingModelPayload = null;
        var pendingMode = null;

        window.addEventListener("message", function (event) {
            if (!event.data || typeof event.data !== "object") return;
            if (event.data.type === "LOAD_MODEL" && event.data.payload) {
                if (window.uarGameInstance) {
                    window.uarGameInstance.SendMessage("AR Mode Switcher", "LoadModelFromJS", event.data.payload);
                } else {
                    pendingModelPayload = event.data.payload;
                }
            } else if (event.data.type === "SET_MODE" && event.data.mode) {
                if (window.uarGameInstance) {
                    window.uarGameInstance.SendMessage("AR Mode Switcher", "SetMode", event.data.mode);
                } else {
                    pendingMode = event.data.mode;
                }
            } else if (event.data.type === "RESIZE_VIEWPORT") {
                window.dispatchEvent(new Event("resize"));
            }
        });

        function CreateUnityLoader() {
            createUnityInstance(canvas, config, (progress) => {
                spinner.style.display = "none";
                progressBarEmpty.style.display = "";
                progressBarFull.style.width = `${100 * progress}%`;
            }).then((unityInstance) => {
                loadingCover.style.display = "none";
                window.uarGameInstance = unityInstance;
                if (pendingMode) {
                    unityInstance.SendMessage("AR Mode Switcher", "SetMode", pendingMode);
                    pendingMode = null;
                }
                if (pendingModelPayload) {
                    unityInstance.SendMessage("AR Mode Switcher", "LoadModelFromJS", pendingModelPayload);
                    pendingModelPayload = null;
                }
            }).catch((message) => {
                alert(message);
            });
        }

    </script>
</body>

</html>
