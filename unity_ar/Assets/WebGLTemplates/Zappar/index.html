<!-- Zappar WebGL template for Unity 2020 and above versions -->
<!-- NFYNT -->
<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="favicon.ico">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
        html {
            box-sizing: border-box;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        html,
        body {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        canvas {
            display: block;
        }

        body {
            margin: 0;
        }

        #unity-container {
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;

            background: {{{ BACKGROUND_COLOR }}};
        }

        #loading-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #unity-loading-bar {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #unity-progress-bar-empty {
            width: 80%;
            height: 24px;
            margin: 10px 20px 20px 10px;
            text-align: left;
            border: 1px solid white;
            padding: 2px;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: white;
        }

        .light #unity-progress-bar-empty {
            border-color: black;
        }

        .light #unity-progress-bar-full {
            background: black;
        }

        .spinner,
        .spinner:after {
            border-radius: 50%;
            width: 5em;
            height: 5em;
        }

        .spinner {
            margin: 10px;
            font-size: 10px;
            position: relative;
            text-indent: -9999em;
            border-top: 1.1em solid rgba(255, 255, 255, 0.2);
            border-right: 1.1em solid rgba(255, 255, 255, 0.2);
            border-bottom: 1.1em solid rgba(255, 255, 255, 0.2);
            border-left: 1.1em solid #ffffff;
            transform: translateZ(0);
            animation: spinner-spin 1.1s infinite linear;
        }

        @keyframes spinner-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="{{{ SPLASH_SCREEN_STYLE.toLowerCase() }}}">
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>
    <script type="text/javascript" src="https://libs.zappar.com/zappar-cv/2.1.9/zappar-cv.js"></script>
    <script>
        var db = indexedDB.open("dummy_indexdb", 1); // iOS 14.6 fix; the call to open indexdb hangs forever otherwise

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
        const config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        #if USE_THREADS
            workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
        #endif
        #if USE_WASM
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        #endif
        #if MEMORY_FILENAME
           memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
        #endif
        #if SYMBOLS_FILENAME
            symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
        #endif
            streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}",
        //Useful when used along with Filename as Hashes option
        #if USE_DATA_CACHING
            cacheControl: function (url) {
            // typically includes: .data, .bundle, .zpt
            ZAPPAR_WEBGL_CACHING   
            if (url.match(/\.mp4/) || url.match(/\.custom/) || url.match(/\.zbin/)) {
                return "immutable";
            }   
            // Disable explicit caching for all other files.
            // Note: the default browser cache may cache them anyway.
            return "no-store";
            },
        #endif
        };

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector('.spinner');

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            // Limitar devicePixelRatio en móviles evita saturar la VRAM y el ancho de banda WebGL
            // (en pantallas 3x Retina reduce 80% la carga de sombreado sin pérdida visual perceptible).
            config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.25);
        }
#if BACKGROUND_FILENAME
        canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
        loadingCover.style.display = "";

        window.zappar = ZCV.initialize();

        // Blindaje de estabilidad del pipeline WebGL/WASM de Zappar y Watchdog del stream de cámara
        (function installZapparStabilityGuard(z) {
            if (!z) return;

            var lastProcessTime = 0;
            var minProcessIntervalMs = 28; // ~35 FPS máx para visión por computadora (la cámara entrega 30 FPS)

            if (typeof z.pipeline_process_gl === "function") {
                var origProcessGl = z.pipeline_process_gl.bind(z);
                z.pipeline_process_gl = function (pipeline) {
                    var now = performance.now();
                    if (now - lastProcessTime < minProcessIntervalMs) {
                        return 0;
                    }
                    lastProcessTime = now;
                    try {
                        return origProcessGl(pipeline);
                    } catch (err) {
                        console.warn("[ViMARA AR] Recuperación automática en pipeline_process_gl:", err);
                        return 0;
                    }
                };
            }

            if (typeof z.pipeline_camera_frame_upload_gl === "function") {
                var origUploadGl = z.pipeline_camera_frame_upload_gl.bind(z);
                z.pipeline_camera_frame_upload_gl = function (pipeline) {
                    try {
                        return origUploadGl(pipeline);
                    } catch (err) {
                        console.warn("[ViMARA AR] Recuperación automática en pipeline_camera_frame_upload_gl:", err);
                        return 0;
                    }
                };
            }

            if (typeof z.pipeline_frame_update === "function") {
                var origFrameUpdate = z.pipeline_frame_update.bind(z);
                z.pipeline_frame_update = function (pipeline) {
                    try {
                        return origFrameUpdate(pipeline);
                    } catch (err) {
                        console.warn("[ViMARA AR] Recuperación automática en pipeline_frame_update:", err);
                        return 0;
                    }
                };
            }

            function ensureCameraVideosPlaying() {
                if (document.visibilityState && document.visibilityState !== "visible") return;
                var videos = document.getElementsByTagName("video");
                for (var i = 0; i < videos.length; i++) {
                    var v = videos[i];
                    v.playsInline = true;
                    v.muted = true;
                    if (!v.hasAttribute("playsinline")) v.setAttribute("playsinline", "");
                    if (v.paused && v.srcObject) {
                        v.play().catch(function () {});
                    }
                }
            }

            setInterval(ensureCameraVideosPlaying, 1200);
            document.addEventListener("visibilitychange", ensureCameraVideosPlaying);
            window.addEventListener("focus", ensureCameraVideosPlaying);
            window.addEventListener("pageshow", ensureCameraVideosPlaying);
            window.addEventListener("touchstart", ensureCameraVideosPlaying, { passive: true });
        })(window.zappar);

        const script = document.createElement("script");
        script.src = loaderUrl;
        //script.onload = () => { CreateUnityLoader();   };
        document.body.appendChild(script);

        ZAPPAR_PERMISSIONS_IMPLEMENTATION

        function WaitForZCVLoad() {
            if (zappar.loaded()) {
                CreateUnityLoader();
                return;
            }
            setTimeout(WaitForZCVLoad, 500);
        }

        var pendingModelPayload = null;
        var pendingMode = null;

        window.addEventListener("message", function (event) {
            if (!event.data || typeof event.data !== "object") return;
            if (event.data.type === "LOAD_MODEL" && event.data.payload) {
                if (window.uarGameInstance) {
                    window.uarGameInstance.SendMessage("AR Mode Switcher", "LoadModelFromJS", event.data.payload);
                } else {
                    pendingModelPayload = event.data.payload;
                }
            } else if (event.data.type === "SET_MODE" && event.data.mode) {
                if (window.uarGameInstance) {
                    window.uarGameInstance.SendMessage("AR Mode Switcher", "SetMode", event.data.mode);
                } else {
                    pendingMode = event.data.mode;
                }
            } else if (event.data.type === "RESIZE_VIEWPORT") {
                window.dispatchEvent(new Event("resize"));
            }
        });

        function CreateUnityLoader() {
            createUnityInstance(canvas, config, (progress) => {
                spinner.style.display = "none";
                progressBarEmpty.style.display = "";
                progressBarFull.style.width = `${100 * progress}%`;
            }).then((unityInstance) => {
                loadingCover.style.display = "none";
                window.uarGameInstance = unityInstance;
                if (pendingMode) {
                    unityInstance.SendMessage("AR Mode Switcher", "SetMode", pendingMode);
                    pendingMode = null;
                }
                if (pendingModelPayload) {
                    unityInstance.SendMessage("AR Mode Switcher", "LoadModelFromJS", pendingModelPayload);
                    pendingModelPayload = null;
                }
            }).catch((message) => {
                alert(message);
            });
        }

    </script>
</body>

</html>
